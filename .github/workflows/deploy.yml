name: Deploy to S3 + CloudFront

on:
  push:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  S3_BUCKET: stendear.com
  CLOUDFRONT_DIST_ID: EB7S9CWI7202B

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci
      - run: npm run build

      - name: Debug list out
        run: |
          pwd
          ls -la
          ls -la out || true
          find out -maxdepth 2 -type f | sed -n '1,200p'


      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::479891288832:role/github-actions-s3-deploy
          aws-region: ${{ env.AWS_REGION }}

      - run: aws s3 sync out s3://${{ env.S3_BUCKET }} --delete
      - run: aws cloudfront create-invalidation --distribution-id ${{ env.CLOUDFRONT_DIST_ID }} --paths "/*"
